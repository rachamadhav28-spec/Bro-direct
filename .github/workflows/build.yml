name: Build BRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
